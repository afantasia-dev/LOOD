<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR - Quantized Grid 1mm (5x5x5m + Cámara Relativa + Zero GC)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000000; position: relative; }
        #camera-video { position: absolute; opacity: 0; pointer-events: none; z-index: -10; }
        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; background: transparent; }
    </style>
</head>
<body class="bg-black m-0 p-0 overflow-hidden">

    <video id="camera-video" playsinline autoplay muted></video>
    <canvas id="bg-canvas"></canvas>
    <canvas id="ar-canvas"></canvas>

    <button id="audio-btn" class="fixed bottom-6 left-6 z-[100] bg-purple-600 text-white w-14 h-14 flex items-center justify-center rounded-full shadow-lg border-2 border-white/20 active:scale-95 transition-all text-2xl">
        🎵
    </button>

    <script>
        // --- GESTIÓN DE AUDIO ---
        const AUDIO_URL = "https://raw.githubusercontent.com/afantasia-dev/TEC2026/main/Kustatiicha.mp3";
        const bgMusic = new Audio(AUDIO_URL);
        bgMusic.loop = true; 
        let isPlaying = false;

        const audioBtn = document.getElementById('audio-btn');
        audioBtn.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                audioBtn.innerText = '🎵';
                audioBtn.classList.replace('bg-red-500', 'bg-purple-600');
            } else {
                bgMusic.play().catch(e => console.error("Error de audio:", e));
                audioBtn.innerText = '⏸';
                audioBtn.classList.replace('bg-purple-600', 'bg-red-500');
            }
            isPlaying = !isPlaying;
        });

        // --- 1. WORKER CODE ---
        const workerCode = `
            importScripts('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js');
            self.onmessage = function(e) {
                try {
                    const { id, width, height, buffer } = e.data;
                    const data = new Uint8ClampedArray(buffer);
                    const qr = jsQR(data, width, height, { inversionAttempts: "dontInvert" });
                    
                    if (qr && qr.location) {
                        self.postMessage({ id, success: true, location: qr.location, data: qr.data });
                    } else {
                        self.postMessage({ id, success: false });
                    }
                } catch (error) {
                    self.postMessage({ id: e.data.id, success: false });
                }
            };
        `;
        const workerUrl = URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' }));

        // --- 2. PIPELINE DE 30 FPS ---
        const SCAN_WIDTH = 540; 
        let SCAN_HEIGHT = 960; 

        const MAX_WORKERS = navigator.hardwareConcurrency || 4; 
        const workers = [], idleWorkers = [];
        let latestProcessedId = 0;

        for (let i = 0; i < MAX_WORKERS; i++) {
            const w = new Worker(workerUrl);
            workers.push(w); idleWorkers.push(w);
            w.onmessage = function(e) {
                const { id, success, location, data } = e.data;
                idleWorkers.push(w); 

                if (id < latestProcessedId) return;
                latestProcessedId = id;

                if (success) handleWorkerResult(location, data);
                else handleWorkerMiss();
            };
        }

        // --- 3. VARIABLES, MEMORIA ESTÁTICA Y CONSTANTES DE CUADRÍCULA ---
        const MI_QR_OBJETIVO = "www.afantasia.dev/mariposa"; 

        let scene = null, camera = null, renderer = null;
        let qrFloorAnchor = null, modelContainer = null;
        let isTracked = false, lostFrames = 0;
        const QR_HALF_SIZE = 0.06;

        // Parámetros de la cuadrícula: 5m x 5m x 5m (-2.5m a +2.5m) con subdivisión de 1mm (0.001m)
        const GRID_RESOLUTION = 0.001; 
        const HALF_GRID_SIZE = 2.5;    

        // Pool estático para el Modelo (Zero-Allocation)
        const targetPos = new THREE.Vector3();
        const targetQuat = new THREE.Quaternion();
        const calculatedPos = new THREE.Vector3();
        const calculatedQuat = new THREE.Quaternion();
        
        // Pool estático para la Cámara Relativa (Cinemática Inversa)
        const invMatrix = new THREE.Matrix4();
        const relativePos = new THREE.Vector3();
        const relativeQuat = new THREE.Quaternion();

        // Vectores y matrices auxiliares preasignados (evitan .clone() y new THREE en caliente)
        const rx = new THREE.Vector3();
        const rz = new THREE.Vector3();
        const ry = new THREE.Vector3();
        const tempVec = new THREE.Vector3();
        const scaleOne = new THREE.Vector3(1, 1, 1);
        const dummyScale = new THREE.Vector3();
        const mat4Temp = new THREE.Matrix4();
        
        const STATIC_M = new Array(8);
        for(let i=0; i<8; i++) STATIC_M[i] = new Float32Array(9);
        const STATIC_X = new Float32Array(8);
        const STATIC_B = new Float32Array(8);
        const STATIC_A = new Array(8);
        for(let i=0; i<8; i++) STATIC_A[i] = new Float32Array(8);

        const cornersBuffer = [
            { x: 0, y: 0 },
            { x: 0, y: 0 },
            { x: 0, y: 0 },
            { x: 0, y: 0 }
        ];

        let hasInitialPose = false;
        let mixer = null;
        const clock = new THREE.Clock(); 

        const REMOTE_MODEL_RAW = "https://raw.githubusercontent.com/afantasia-dev/TEC2026/main/mariposa.glb";

        const video = document.getElementById('camera-video');
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d', { alpha: false, desynchronized: true }); 
        const arCanvas = document.getElementById('ar-canvas');
        const scanCanvas = document.createElement('canvas');
        const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true, alpha: false });
        
        let renderW, renderH, offsetX, offsetY, frameCounter = 0;
        let lastDispatchTime = 0;
        const DISPATCH_INTERVAL = 1000 / 30; // 33.3ms (Escaneo a 30 FPS)
        
        // --- CONTROL DE 60 FPS PARA EL RENDER ---
        let lastRenderTime = 0;
        const RENDER_INTERVAL = 1000 / 60; // 16.6ms (Límite estricto a 60 FPS)

        window.focalLengthScreen = null; 

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play().then(() => { if (!scene) initThreeAndTracking(); }).catch(err => {
                        window.addEventListener('click', () => { video.play(); if (!scene) initThreeAndTracking(); }, { once: true });
                    });
                };
            } catch (err) { window.addEventListener('click', () => startCamera(), { once: true }); }
        }

        function initThreeAndTracking() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);
            camera.position.set(0, 0, 0);

            const canvasElement = arCanvas;
            const glContext = canvasElement.getContext('webgl2', { alpha: true, antialias: true, powerPreference: 'high-performance' });

            renderer = new THREE.WebGLRenderer({ 
                canvas: canvasElement, 
                context: glContext,
                alpha: true, 
                antialias: true, 
                powerPreference: 'high-performance' 
            });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;

            scene.add(new THREE.AmbientLight(0xffffff, 1.4));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
            dirLight.position.set(2.0, 5.0, 3.0);
            scene.add(dirLight);

            qrFloorAnchor = new THREE.Group();
            qrFloorAnchor.visible = false;
            scene.add(qrFloorAnchor);

            // Diagnóstico visual
            const s = QR_HALF_SIZE;
            const squareGroup = new THREE.Group();
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-s,0,-s, s,0,-s, s,0,-s, s,0,s, s,0,s, -s,0,s, -s,0,s, -s,0,-s]), 3));
            squareGroup.add(new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2 })));
            
            const dotGeo = new THREE.SphereGeometry(0.003, 8, 8);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const corners = [ [-s, 0, -s], [s, 0, -s], [s, 0, s], [-s, 0, s] ];
            corners.forEach(pos => {
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.set(pos[0], pos[1], pos[2]);
                squareGroup.add(dot);
            });

            qrFloorAnchor.add(squareGroup);
            modelContainer = new THREE.Group();
            qrFloorAnchor.add(modelContainer);

            loadRemoteModel();
            window.addEventListener('resize', onResize);
            requestAnimationFrame(renderLoop);
        }

        function loadRemoteModel() {
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.3/');
            const loader = new THREE.GLTFLoader();
            loader.setDRACOLoader(dracoLoader);

            loader.load(
                REMOTE_MODEL_RAW,
                function (gltf) {
                    const model = gltf.scene;
                    
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                        gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                    }
                    
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.frustumCulled = false;
                            if (child.geometry) child.geometry.computeVertexNormals();

                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(m => { 
                                    if (m.map) {
                                        m.map.encoding = THREE.sRGBEncoding;
                                        m.map.generateMipmaps = true;
                                        m.map.minFilter = THREE.LinearMipmapLinearFilter;
                                        if (renderer.capabilities.getMaxAnisotropy) {
                                            m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
                                        }
                                    }
                                    if (m.emissiveMap) m.emissiveMap.encoding = THREE.sRGBEncoding;
                                    m.side = THREE.DoubleSide; 
                                    m.needsUpdate = true;
                                });
                            }
                        }
                    });

                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3()); 
                    const center = box.getCenter(new THREE.Vector3());
                    const qrAnchoFisico = QR_HALF_SIZE * 6;
                    const maxDim = Math.max(size.x, size.z);
                    
                    if (maxDim > 0) {
                        const scale = qrAnchoFisico / maxDim;
                        model.scale.set(scale, scale, scale);
                        model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
                        modelContainer.add(model);
                    }
                },
                undefined,
                function (error) {
                    console.error("[WebAR] Error cargando modelo:", error);
                }
            );
        }

        // --- MATRICIAL ZERO-ALLOCATION ---
        function solve8x8() {
            const n = 8;
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) STATIC_M[i][j] = STATIC_A[i][j];
                STATIC_M[i][n] = STATIC_B[i];
            }

            for (let i = 0; i < n; i++) {
                let maxRow = i;
                let maxVal = Math.abs(STATIC_M[i][i]);
                for (let k = i + 1; k < n; k++) {
                    const val = Math.abs(STATIC_M[k][i]);
                    if (val > maxVal) { maxVal = val; maxRow = k; }
                }
                if (maxVal < 1e-7) return false;
                
                if (maxRow !== i) {
                    const temp = STATIC_M[i];
                    STATIC_M[i] = STATIC_M[maxRow];
                    STATIC_M[maxRow] = temp;
                }
                
                const pivot = STATIC_M[i][i];
                for (let k = i + 1; k < n; k++) {
                    const factor = STATIC_M[k][i] / pivot;
                    for (let j = i; j <= n; j++) {
                        STATIC_M[k][j] -= factor * STATIC_M[i][j];
                    }
                }
            }

            for (let i = n - 1; i >= 0; i--) {
                let sum = STATIC_M[i][n];
                for (let j = i + 1; j < n; j++) {
                    sum -= STATIC_M[i][j] * STATIC_X[j];
                }
                STATIC_X[i] = sum / STATIC_M[i][i];
            }
            return true;
        }

        const s = QR_HALF_SIZE;
        const ptsObjX = [-s, s, s, -s];
        const ptsObjZ = [-s, -s, s, s];

        // --- FUNCIONES DE CUANTIZACIÓN A REJILLA DE 1MM ---
        function snapToGrid(vec3) {
            vec3.x = Math.round(vec3.x / GRID_RESOLUTION) * GRID_RESOLUTION;
            vec3.y = Math.round(vec3.y / GRID_RESOLUTION) * GRID_RESOLUTION;
            vec3.z = Math.round(vec3.z / GRID_RESOLUTION) * GRID_RESOLUTION;
        }

        function snapQuaternion(quat) {
            quat.x = Math.round(quat.x * 10000) / 10000;
            quat.y = Math.round(quat.y * 10000) / 10000;
            quat.z = Math.round(quat.z * 10000) / 10000;
            quat.w = Math.round(quat.w * 10000) / 10000;
            quat.normalize(); // Mantiene el cuaternión unitario para no deformar la escala
        }

        function processCorners(rawCorners) {
            const sw = window.innerWidth, sh = window.innerHeight;
            const cx = sw / 2, cy = sh / 2;
            const f = window.focalLengthScreen || ((sh / 2) / Math.tan((60 * Math.PI) / 360));
            
            for (let i = 0; i < 4; i++) {
                const X = ptsObjX[i], Z = ptsObjZ[i];
                const u = (rawCorners[i].x - cx) / f;
                const v = -(rawCorners[i].y - cy) / f;

                const r2i = 2 * i;
                STATIC_A[r2i][0] = X; STATIC_A[r2i][1] = Z; STATIC_A[r2i][2] = 1; 
                STATIC_A[r2i][3] = 0; STATIC_A[r2i][4] = 0; STATIC_A[r2i][5] = 0; 
                STATIC_A[r2i][6] = -u * X; STATIC_A[r2i][7] = -u * Z;
                STATIC_B[r2i] = u;

                const r2i1 = 2 * i + 1;
                STATIC_A[r2i1][0] = 0; STATIC_A[r2i1][1] = 0; STATIC_A[r2i1][2] = 0; 
                STATIC_A[r2i1][3] = X; STATIC_A[r2i1][4] = Z; STATIC_A[r2i1][5] = 1; 
                STATIC_A[r2i1][6] = -v * X; STATIC_A[r2i1][7] = -v * Z;
                STATIC_B[r2i1] = v;
            }

            if (!solve8x8()) { handleWorkerMiss(); return; }
            
            const h1x = STATIC_X[0], h1y = STATIC_X[3], h1z = -STATIC_X[6];
            const h2x = STATIC_X[1], h2y = STATIC_X[4], h2z = -STATIC_X[7];
            const h3x = STATIC_X[2], h3y = STATIC_X[5], h3z = -1.0;
            
            const norm1 = Math.hypot(h1x, h1y, h1z);
            const norm2 = Math.hypot(h2x, h2y, h2z);
            if (norm1 < 1e-6 || norm2 < 1e-6) { handleWorkerMiss(); return; }

            const lambda = (norm1 + norm2) / 2.0;
            
            rx.set(h1x/lambda, h1y/lambda, h1z/lambda).normalize();
            rz.set(h2x/lambda, h2y/lambda, h2z/lambda);
            
            // Gram-Schmidt sin crear objetos nuevos (reusa tempVec)
            tempVec.copy(rx).multiplyScalar(rx.dot(rz));
            rz.sub(tempVec).normalize();
            ry.crossVectors(rz, rx).normalize();

            calculatedPos.set(h3x/lambda, h3y/lambda, h3z/lambda);
            mat4Temp.makeBasis(rx, ry, rz);
            calculatedQuat.setFromRotationMatrix(mat4Temp);

            // Verificación de hemisferio sin clonar vectores
            tempVec.copy(calculatedPos).negate().normalize();
            if (ry.dot(tempVec) < 0) { 
                ry.negate(); 
                rz.negate(); 
                mat4Temp.makeBasis(rx, ry, rz);
                calculatedQuat.setFromRotationMatrix(mat4Temp);
            }

            // --- 1. PINEADO DEL MODELO A LA CUADRÍCULA (1MM) Y LÍMITE DE 5X5X5M ---
            snapToGrid(calculatedPos);
            snapQuaternion(calculatedQuat);

            if (Math.abs(calculatedPos.x) > HALF_GRID_SIZE || 
                Math.abs(calculatedPos.y) > HALF_GRID_SIZE || 
                Math.abs(calculatedPos.z) > HALF_GRID_SIZE) {
                handleWorkerMiss();
                return;
            }

            // --- 2. CÁMARA RELATIVA (MATRIZ INVERSA) Y PINEADO A LA CUADRÍCULA ---
            mat4Temp.compose(calculatedPos, calculatedQuat, scaleOne);
            invMatrix.copy(mat4Temp).invert();
            invMatrix.decompose(relativePos, relativeQuat, dummyScale);

            snapToGrid(relativePos);
            snapQuaternion(relativeQuat);

            // --- 3. ZONA MUERTA (Filtra variaciones menores a 2.5 mm) ---
            if (hasInitialPose) {
                const dist = targetPos.distanceTo(calculatedPos);
                if (dist < 0.0025) return; 
            }

            targetPos.copy(calculatedPos);
            targetQuat.copy(calculatedQuat);

            if (!hasInitialPose) {
                qrFloorAnchor.position.copy(targetPos);
                qrFloorAnchor.quaternion.copy(targetQuat);
                hasInitialPose = true;
            }

            qrFloorAnchor.visible = true; 
            lostFrames = 0; 
            isTracked = true;
        }

        function handleWorkerResult(location, qrData) {
            if (MI_QR_OBJETIVO !== "" && qrData !== MI_QR_OBJETIVO) {
                handleWorkerMiss();
                return;
            }
            cornersBuffer[0].x = offsetX + (location.topLeftCorner.x / SCAN_WIDTH) * renderW;
            cornersBuffer[0].y = offsetY + (location.topLeftCorner.y / SCAN_HEIGHT) * renderH;
            cornersBuffer[1].x = offsetX + (location.topRightCorner.x / SCAN_WIDTH) * renderW;
            cornersBuffer[1].y = offsetY + (location.topRightCorner.y / SCAN_HEIGHT) * renderH;
            cornersBuffer[2].x = offsetX + (location.bottomRightCorner.x / SCAN_WIDTH) * renderW;
            cornersBuffer[2].y = offsetY + (location.bottomRightCorner.y / SCAN_HEIGHT) * renderH;
            cornersBuffer[3].x = offsetX + (location.bottomLeftCorner.x / SCAN_WIDTH) * renderW;
            cornersBuffer[3].y = offsetY + (location.bottomLeftCorner.y / SCAN_HEIGHT) * renderH;

            processCorners(cornersBuffer);
        }

        function handleWorkerMiss() {
            lostFrames++;
            if (lostFrames > 8) { 
                qrFloorAnchor.visible = false; 
                isTracked = false; 
                hasInitialPose = false;
            }
        }

        function dispatchFrameToWorker() {
            const now = performance.now();
            if (now - lastDispatchTime < DISPATCH_INTERVAL) return;

            if (!video || video.readyState < video.HAVE_ENOUGH_DATA) return;
            if (idleWorkers.length === 0) return; 

            lastDispatchTime = now;

            const sw = window.innerWidth;
            const vw = video.videoWidth || sw, vh = video.videoHeight || window.innerHeight;

            SCAN_HEIGHT = Math.round((SCAN_WIDTH / vw) * vh);
            if (scanCanvas.width !== SCAN_WIDTH) { scanCanvas.width = SCAN_WIDTH; scanCanvas.height = SCAN_HEIGHT; }

            scanCtx.drawImage(video, 0, 0, SCAN_WIDTH, SCAN_HEIGHT);
            const imageData = scanCtx.getImageData(0, 0, SCAN_WIDTH, SCAN_HEIGHT);
            
            const worker = idleWorkers.pop();
            frameCounter++;

            worker.postMessage({ 
                id: frameCounter, 
                width: SCAN_WIDTH, 
                height: SCAN_HEIGHT, 
                buffer: imageData.data.buffer 
            }, [imageData.data.buffer]);
        }

        function updateCoverMath() {
            const sw = window.innerWidth, sh = window.innerHeight;
            const vw = video.videoWidth || sw, vh = video.videoHeight || sh;
            const screenRatio = sw / sh, videoRatio = vw / vh;
            
            let scale;
            if (screenRatio > videoRatio) { 
                renderW = sw; renderH = sw / videoRatio; offsetX = 0; offsetY = (sh - renderH) / 2; 
                scale = sw / vw;
            } else { 
                renderH = sh; renderW = sh * videoRatio; offsetX = (sw - renderW) / 2; offsetY = 0; 
                scale = sh / vh;
            }

            const VIDEO_VERTICAL_FOV = 60; 
            const f_video = (vh / 2) / Math.tan((VIDEO_VERTICAL_FOV * Math.PI) / 360);
            window.focalLengthScreen = f_video * scale;

            if (camera) {
                const newFov = 2 * Math.atan((sh / 2) / window.focalLengthScreen) * (180 / Math.PI);
                if (Math.abs(camera.fov - newFov) > 0.1) {
                    camera.fov = newFov;
                    camera.aspect = sw / sh;
                    camera.updateProjectionMatrix();
                }
            }
        }

        function renderVideoToCanvas() {
            if (video.readyState >= video.HAVE_CURRENT_DATA) {
                if (bgCanvas.width !== window.innerWidth || bgCanvas.height !== window.innerHeight) {
                    bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
                }
                updateCoverMath();
                bgCtx.drawImage(video, offsetX, offsetY, renderW, renderH);
            }
        }

        function onResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCoverMath();
        }

        // --- BUCLE DE RENDER LIMITADO ESTRICTAMENTE A 60 FPS MÁXIMO ---
        function renderLoop(currentTime) { 
            requestAnimationFrame(renderLoop); 
            
            const elapsed = currentTime - lastRenderTime;
            if (elapsed < RENDER_INTERVAL) return;
            
            lastRenderTime = currentTime - (elapsed % RENDER_INTERVAL);

            renderVideoToCanvas(); 
            dispatchFrameToWorker(); // Escaneo QR a 30 FPS en segundo plano
            
            const delta = clock.getDelta();

            if (mixer) {
                mixer.update(delta);
            }

            if (isTracked && hasInitialPose) {
                const LERP_FACTOR = 0.25; 
                qrFloorAnchor.position.lerp(targetPos, LERP_FACTOR);
                qrFloorAnchor.quaternion.slerp(targetQuat, LERP_FACTOR);
                qrFloorAnchor.visible = true;
            }

            if (renderer && scene && camera) renderer.render(scene, camera); 
        }

        startCamera();
    </script>
</body>
</html>
